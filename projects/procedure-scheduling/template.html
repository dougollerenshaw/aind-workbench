<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AIND Procedure Schedule</title>
<!-- No external assets: the calendar grid is hand-rolled vanilla JS/CSS.
     FullCalendar was removed in M13 because its timeline has exactly one
     resource axis and cannot nest dates ABOVE instruments, which is the
     layout Doug's mockup asks for. Side benefit: the page has zero external
     requests, so it works with no internet access in the viewer's browser. -->
<style>
  :root {
    --border: #d6d9de;
    --muted: #5c6470;
    --accent: #1d4e89;
    --bg: #f7f8fa;
    --today: rgba(29, 78, 137, 0.07);
    --now: #d1495b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: #1c2128;
    background: var(--bg);
  }
  header {
    padding: 0.8rem 1.2rem 0.6rem;
    background: #fff;
    border-bottom: 1px solid var(--border);
  }
  header h1 { margin: 0 0 0.15rem; font-size: 1.25rem; }
  header .subtitle { margin: 0 0 0.6rem; color: var(--muted); font-size: 0.85rem; }
  header .subtitle a { color: var(--accent); }

  .filters {
    display: flex; flex-wrap: wrap; gap: 0.6rem 1rem; align-items: end;
    margin-bottom: 0.5rem;
  }
  .filters label { display: flex; flex-direction: column; font-size: 0.75rem; color: var(--muted); gap: 2px; }
  .filters select, .filters input {
    font-size: 0.85rem; padding: 0.25rem 0.35rem;
    border: 1px solid var(--border); border-radius: 4px; background: #fff;
  }
  .filters .inline-check { flex-direction: row; align-items: center; gap: 0.3rem; }
  button {
    font-size: 0.85rem; padding: 0.35rem 0.8rem; border-radius: 4px;
    border: 1px solid var(--border); background: #fff; cursor: pointer;
  }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  button:hover { filter: brightness(0.96); }
  .view-switch { display: inline-flex; gap: 0.3rem; }

  #legend { display: flex; flex-wrap: wrap; gap: 0.35rem 0.9rem; font-size: 0.75rem; color: var(--muted); }
  #legend .chip { display: inline-flex; align-items: center; gap: 0.3rem; }
  #legend .swatch { width: 0.7rem; height: 0.7rem; border-radius: 3px; display: inline-block; }
  .notice { margin: 0.35rem 0 0; font-size: 0.75rem; color: #8c5a2f; min-height: 0.9rem; }

  #layout { display: flex; gap: 0; align-items: flex-start; }

  /* ------------------------------------------------------------------ */
  /* Hand-rolled schedule grid.                                          */
  /*                                                                     */
  /* Structure: ONE horizontally-scrolling container (#grid-scroll) holds  */
  /* every block, so scrolling any block scrolls them all together — the   */
  /* blocks share a single scrollbar by construction. Inside it, blocks    */
  /* stack vertically (day → instrument sub-rows → next day), and the      */
  /* page itself scrolls vertically for past/future days.                 */
  /* ------------------------------------------------------------------ */
  #calendar {
    flex: 1; min-width: 0; background: #fff; margin: 0.8rem;
    border: 1px solid var(--border); border-radius: 6px;
  }
  /* ONE scroll container for both axes. Horizontal: all blocks share it, so
     they scroll together. Vertical: blocks stack inside it, so scrolling up
     reveals past days. Both sticky offsets below are relative to this box.
     (Note: `overflow-x: auto` with `overflow-y: visible` would compute to
     `auto` anyway, so make the two-axis container explicit.) */
  #grid-scroll {
    overflow-x: auto;
    /* `scroll`, not `auto`, on purpose: the vertical scrollbar appears only
       once the blocks are rendered, and if it appears AFTER the lane widths
       were measured it steals ~15px of clientWidth and pushes the week view
       into a spurious horizontal scroll. Reserving it keeps clientWidth
       stable across the measure/render cycle. */
    overflow-y: scroll;
    max-height: calc(100vh - 14rem);
    min-height: 18rem;
  }
  #grid-inner { position: relative; }

  /* Sticky time axis: sticks to the top of the viewport while the page
     scrolls vertically, and scrolls horizontally with the lanes so the hour
     labels stay aligned with the bars underneath. */
  .axis-header {
    position: sticky; top: 0; z-index: 6; display: flex;
    background: #fff; border-bottom: 1px solid var(--border);
  }
  .axis-corner {
    position: sticky; left: 0; z-index: 7; flex: none;
    background: #fff; border-right: 1px solid var(--border);
    font-size: 0.7rem; color: var(--muted); text-transform: uppercase;
    letter-spacing: 0.04em; display: flex; align-items: center; padding-left: 0.6rem;
  }
  .axis-units { position: relative; flex: none; height: 1.6rem; }
  .axis-unit {
    position: absolute; top: 0; bottom: 0; padding-left: 0.25rem;
    font-size: 0.7rem; color: var(--muted); border-left: 1px solid var(--border);
    white-space: nowrap; overflow: hidden;
  }

  .day-block { border-bottom: 2px solid var(--border); }
  .day-block.is-today .day-header { background: var(--today); font-weight: 600; }
  /* The band spans the whole (very wide) lane area, but the LABEL inside it
     is what sticks: `position: sticky` on a full-width box does nothing,
     because the box never leaves the scrollport — the text just sits at its
     far-left edge, scrolled out of sight. So the band is static and
     .day-header-label is a narrow sticky child. */
  .day-header {
    z-index: 4; font-size: 0.82rem; background: #fbfcfd;
    border-bottom: 1px solid var(--border);
  }
  .day-header-label {
    position: sticky; left: 0; display: inline-flex; gap: 0.5rem;
    align-items: baseline; padding: 0.3rem 0.6rem; white-space: nowrap;
  }
  .day-header .today-badge {
    font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.05em;
    color: #fff; background: var(--accent); border-radius: 999px; padding: 0.05rem 0.45rem;
  }
  .day-header .count { color: var(--muted); font-size: 0.72rem; font-weight: 400; }

  .block-body { position: relative; }
  .instrument-row { display: flex; border-top: 1px solid #edeff2; }
  .instrument-row:first-child { border-top: none; }
  .instrument-label {
    position: sticky; left: 0; z-index: 3; flex: none;
    background: #fff; border-right: 1px solid var(--border);
    font-size: 0.75rem; padding: 0.3rem 0.5rem; display: flex; align-items: center;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .lane { position: relative; flex: none; }
  /* Hour/day gridlines are a repeating background so there is no per-line DOM. */
  .lane.ruled {
    background-image: linear-gradient(to right, #edeff2 0 1px, transparent 1px 100%);
    background-repeat: repeat-x;
  }
  .lane.is-today-col { background-color: var(--today); }

  .event-bar {
    position: absolute; top: 3px; bottom: 3px; border-radius: 3px;
    color: #fff; font-size: 0.7rem; line-height: 1.15;
    padding: 0.1rem 0.3rem; cursor: pointer; overflow: hidden;
    white-space: nowrap; text-overflow: ellipsis; border: 1px solid rgba(0,0,0,0.15);
  }
  .event-bar:hover { filter: brightness(1.08); }
  .event-bar:focus-visible { outline: 2px solid #1c2128; outline-offset: 1px; }

  /* Live current-time line: one continuous line across today's block. */
  .now-line {
    position: absolute; top: 0; bottom: 0; width: 2px; background: var(--now);
    z-index: 5; pointer-events: none;
  }
  .now-line::before {
    content: ''; position: absolute; top: -3px; left: -3px;
    width: 8px; height: 8px; border-radius: 50%; background: var(--now);
  }
  .empty-note {
    padding: 0.35rem 0.6rem; font-size: 0.72rem; color: var(--muted);
    position: sticky; left: 0; display: inline-block; white-space: nowrap;
  }
  #grid-status { padding: 0.6rem 0.8rem; font-size: 0.8rem; color: var(--muted); }

  /* Loud bootstrap-failure banner. A broken page must never look like an
     empty schedule — that is the worst failure mode for a demo. The
     :not([hidden]) guard is the M9 lesson: an unguarded `display` rule would
     defeat the hidden attribute. */
  #grid-error:not([hidden]) {
    display: block; margin: 0; padding: 0.6rem 0.8rem;
    background: #fdeaea; border-bottom: 2px solid #c0392b; color: #8c2f2f;
    font-size: 0.85rem; font-weight: 600; white-space: pre-wrap;
  }

  /* Detail side panel */
  #detail-panel {
    width: 21rem; flex: none; margin: 0.8rem 0.8rem 0.8rem 0; padding: 0.9rem 1rem;
    background: #fff; border: 1px solid var(--border); border-radius: 6px;
    font-size: 0.85rem; align-self: flex-start; max-height: 85vh; overflow-y: auto;
    position: sticky; top: 0.8rem;
  }
  #detail-panel h2 { margin: 0 0 0.2rem; font-size: 1rem; }
  #detail-panel .close { float: right; border: none; background: none; font-size: 1rem; }
  #detail-panel dl { margin: 0.5rem 0; }
  #detail-panel dt { color: var(--muted); font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.03em; margin-top: 0.55rem; }
  #detail-panel dd { margin: 0.1rem 0 0; word-break: break-word; }
  #detail-panel code, #detail-panel pre {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 0.78rem; background: var(--bg); border-radius: 4px;
  }
  #detail-panel code { padding: 0.05rem 0.3rem; }
  #detail-panel pre { padding: 0.5rem; overflow-x: auto; margin: 0.2rem 0 0; }
  .status-badge { display: inline-block; padding: 0.05rem 0.5rem; border-radius: 999px; font-size: 0.75rem; border: 1px solid var(--border); text-transform: capitalize; }

  /* Modal form. The :not([hidden]) guard is load-bearing: a bare
     `#modal-backdrop { display: flex }` author rule would override the UA
     stylesheet's `[hidden] { display: none }`, leaving the modal permanently
     visible even with the hidden attribute set (real bug, found in the first
     browser pass). Only apply the flex layout when the element is shown. */
  #modal-backdrop:not([hidden]) {
    position: fixed; inset: 0; background: rgba(20, 24, 30, 0.45);
    display: flex; align-items: flex-start; justify-content: center; padding: 3vh 1rem; z-index: 50;
  }
  #procedure-form {
    background: #fff; border-radius: 8px; padding: 1.1rem 1.3rem; width: 34rem; max-width: 100%;
    max-height: 92vh; overflow-y: auto; font-size: 0.87rem;
  }
  #procedure-form h2 { margin: 0 0 0.8rem; font-size: 1.05rem; }
  #procedure-form .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.6rem 1rem; }
  #procedure-form label { display: flex; flex-direction: column; gap: 2px; font-size: 0.75rem; color: var(--muted); }
  #procedure-form label.wide { grid-column: 1 / -1; }
  #procedure-form select, #procedure-form input, #procedure-form textarea {
    font-size: 0.85rem; padding: 0.3rem 0.4rem; border: 1px solid var(--border); border-radius: 4px;
    font-family: inherit;
  }
  #procedure-form textarea { min-height: 3.2rem; }
  #active-types { display: flex; flex-direction: column; gap: 0.25rem; padding: 0.4rem 0.5rem;
    border: 1px solid var(--border); border-radius: 4px; }
  #active-types .type-option { display: flex; flex-direction: row; align-items: center; gap: 0.4rem;
    font-size: 0.85rem; color: #1c2128; }
  #active-types .hint { color: var(--muted); font-size: 0.78rem; }
  #form-error {
    display: none; margin: 0.7rem 0 0; padding: 0.5rem 0.7rem; border-radius: 4px;
    background: #fdeaea; border: 1px solid #e6a3a3; color: #8c2f2f; white-space: pre-wrap;
  }
  #form-error.visible { display: block; }
  .form-actions { display: flex; justify-content: flex-end; gap: 0.6rem; margin-top: 0.9rem; }
  .muted { color: var(--muted); }
</style>
</head>
<body>

<header>
  <h1>AIND Procedure Schedule</h1>
  <p class="subtitle">
    Prototype scheduling system — every event carries a persistent acquisition token (UUIDv7).
    Read-only API + docs: <a href="/session_schedule/docs">/session_schedule/docs</a>
  </p>

  <div class="filters">
    <span class="view-switch">
      <button type="button" id="view-day" class="active">Day</button>
      <button type="button" id="view-week">Week</button>
    </span>
    <button type="button" id="jump-today">Jump to today</button>
    <label>Platform
      <select id="filter-type"><option value="">All platforms</option></select>
    </label>
    <label>Instrument
      <select id="filter-instrument"><option value="">All instruments</option></select>
    </label>
    <label>From
      <input type="date" id="filter-start">
    </label>
    <label>To
      <input type="date" id="filter-end">
    </label>
    <label>Subject contains
      <input type="text" id="filter-subject" placeholder="e.g. testmouse1" size="12">
    </label>
    <button id="clear-filters" type="button">Clear filters</button>
    <button id="add-btn" type="button" class="primary">Add procedure</button>
    <label class="inline-check" title="Hide day/week blocks that have no procedures">
      <input type="checkbox" id="hide-empty-toggle"> Hide empty days
    </label>
  </div>

  <div id="legend"></div>
  <p id="window-notice" class="notice"></p>
</header>

<div id="layout">
  <div id="calendar">
    <p id="grid-error" hidden></p>
    <div id="grid-scroll">
      <div id="grid-inner"></div>
    </div>
    <p id="grid-status"></p>
  </div>

  <aside id="detail-panel" hidden>
    <button class="close" type="button" title="Close" onclick="closeDetail()">&#10005;</button>
    <h2 id="detail-title"></h2>
    <span class="status-badge" id="detail-status"></span>
    <dl id="detail-fields"></dl>
    <button id="edit-btn" type="button">Edit</button>
  </aside>
</div>

<div id="modal-backdrop" hidden>
  <form id="procedure-form">
    <h2 id="form-title">Add procedure</h2>
    <div class="grid">
      <label>Mouse
        <select id="f-mouse" required></select>
      </label>
      <label>Instrument
        <select id="f-instrument" required></select>
      </label>
      <label>Project
        <select id="f-project" required></select>
      </label>
      <label>Scientific contact
        <select id="f-contact" required></select>
      </label>
      <label class="wide">Experimenter(s) <span class="muted">(ctrl/cmd-click for multiple)</span>
        <select id="f-experimenters" multiple size="3"></select>
      </label>
      <label>Scheduled start <span class="muted">(local time)</span>
        <input type="datetime-local" id="f-start" required>
      </label>
      <label>Duration <span class="muted">(hours)</span>
        <input type="number" id="f-duration" min="0.25" step="0.25" value="2" required>
      </label>
      <div id="end-hint" class="muted" style="grid-column: 1 / -1; font-size: 0.78rem;"></div>
      <label class="wide">Active procedure types
        <span class="muted">(only types compatible with the selected instrument)</span>
        <div id="active-types"><span class="hint">Select an instrument first.</span></div>
      </label>
      <label>Status
        <select id="f-status">
          <option value="scheduled" selected>scheduled</option>
          <option value="completed">completed</option>
          <option value="cancelled">cancelled</option>
          <option value="rescheduled">rescheduled</option>
        </select>
      </label>
      <label class="wide">Protocols
        <input type="text" id="f-protocols" placeholder="e.g. Modular probe insertion, 4 shanks; FIP dual-fiber">
      </label>
      <label class="wide">Notes
        <textarea id="f-notes"></textarea>
      </label>
      <label class="wide">Planned config <span class="muted">(optional JSON)</span>
        <textarea id="f-planned-config" placeholder='{"probe_count": 4}'></textarea>
      </label>
    </div>
    <div id="form-error"></div>
    <div class="form-actions">
      <button type="button" onclick="closeModal()">Cancel</button>
      <button type="submit" class="primary" id="form-submit">Create</button>
    </div>
  </form>
</div>

<script>
'use strict';

const API = '/session_schedule/api';

// The aind-data-schema modality that identifies behavior tasks; a procedure
// may have at most one (mirrors the server's `multiple_behavior_types` rule).
const BEHAVIOR_MODALITY = 'Behavior';

// Stable color per procedure type, indexed by procedure_types.sort_order.
const PALETTE = [
  '#4c78a8', // 1 Acute extracellular electrophysiology
  '#9d755d', // 2 Whole-brain 3D histology
  '#54a24b', // 3 Cellular imaging
  '#e45756', // 4 Fiber photometry (FIP)
  '#b2457a', // 5 Fiber photometry (HSFP)
  '#f58518', // 6 Patch foraging behavior
  '#3c9d9b', // 7 Dynamic foraging behavior
  '#7b6bb2', // 8 Whole-brain axonal imaging
];

// ---------------------------------------------------------------------------
// Grid geometry — the knobs worth adjusting live here.
// ---------------------------------------------------------------------------

// Day view: this hour range fills the viewport width. The full 24 h is always
// rendered; hours outside the focus range are simply off-viewport, reachable
// by scrolling the shared horizontal scrollbar left/right.
const FOCUS_START_HOUR = 8;
const FOCUS_END_HOUR = 18;
const FOCUS_HOURS = FOCUS_END_HOUR - FOCUS_START_HOUR;   // 10 of 24 hours
const HOURS_PER_DAY = 24;
const DAYS_PER_WEEK = 7;

// How much of the calendar exists: today-14 .. today+45. Past days render
// ABOVE today, so scrolling up reveals them.
const WINDOW_DAYS_BEFORE = 14;
const WINDOW_DAYS_AFTER = 45;

const LABEL_WIDTH = 150;      // px, instrument-name column (sticky at left)
const ROW_HEIGHT = 26;        // px, one instrument sub-row
const MIN_BAR_WIDTH = 10;     // px, so a very short procedure stays clickable

// Lookup caches, filled by init().
let procedureTypes = [];        // [{id, name, sort_order, ...}]
let typeInfoByName = {};        // name -> {sort_order, color}
let instruments = [];           // [{id, name, compatible_procedure_types, ...}]
let mice = [], projects = [], users = [];

let viewMode = 'day';           // 'day' | 'week' — day is the default on load
let hideEmpty = false;
let lastRecords = [];           // records currently rendered
let currentDetail = null;       // record shown in the side panel
let editingId = null;           // scheduled_procedure id when the modal edits
let nowLineTimer = null;

// Every read goes through here. One retry, because a single transient hiccup
// (the tool launcher serves requests one at a time, so a burst can queue and
// time out) should not cost the page a whole dependency.
async function fetchJSON(url, attempt = 0) {
  try {
    const response = await fetch(url);
    if (!response.ok) throw new Error(`${url} -> HTTP ${response.status}`);
    return await response.json();
  } catch (err) {
    if (attempt === 0) {
      await new Promise((resolve) => setTimeout(resolve, 500));
      return fetchJSON(url, attempt + 1);
    }
    throw err;
  }
}

// ---------------------------------------------------------------------------
// Bootstrapping
// ---------------------------------------------------------------------------

// Show/clear the loud failure banner at the top of the grid area.
function showBanner(message) {
  const banner = document.getElementById('grid-error');
  banner.textContent = message;     // textContent: never treat errors as markup
  banner.hidden = false;
}

function clearBanner() {
  document.getElementById('grid-error').hidden = true;
}

// Fetch the five lookup tables INDEPENDENTLY. A single Promise.all destructure
// meant one failing dependency left every array empty and the whole page
// blank; now each source settles on its own, whatever arrived is used, and the
// failures are named in the banner.
async function bootstrap() {
  const sources = [
    ['procedure types', `${API}/procedure-types`, (d) => { procedureTypes = d; }],
    ['instruments', `${API}/instruments`, (d) => { instruments = d; }],
    ['mice', `${API}/mice`, (d) => { mice = d; }],
    ['projects', `${API}/projects`, (d) => { projects = d; }],
    ['users', `${API}/users`, (d) => { users = d; }],
  ];
  const settled = await Promise.allSettled(sources.map(([, url]) => fetchJSON(url)));
  const failures = [];
  settled.forEach((result, i) => {
    const [label, , assign] = sources[i];
    if (result.status === 'fulfilled' && Array.isArray(result.value)) {
      assign(result.value);
    } else {
      const reason = result.reason && result.reason.message
        ? result.reason.message : String(result.reason);
      failures.push(`${label} (${reason})`);
    }
  });
  return failures;
}

async function init() {
  clearBanner();
  const failures = await bootstrap();

  for (const t of procedureTypes) {
    typeInfoByName[t.name] = {
      sort_order: t.sort_order,
      color: PALETTE[(t.sort_order - 1) % PALETTE.length],
    };
  }
  // Each step works with whatever loaded; none of them can blank the others.
  buildLegend();
  populateFilters();
  populateFormSelects();

  try {
    await loadEvents();
  } catch (err) {
    failures.push(`scheduled procedures (${err.message})`);
    renderGrid();     // still draw the axis/rows so the page is not blank
  }

  if (failures.length) {
    showBanner(
      `Could not load: ${failures.join('; ')}. The page is incomplete — ` +
      `reload, and check the API is up at /session_schedule/docs.`
    );
  }
  scrollToToday();
  startNowLineTicker();
}

function buildLegend() {
  const legend = document.getElementById('legend');
  legend.innerHTML = '';
  for (const t of procedureTypes) {
    const chip = document.createElement('span');
    chip.className = 'chip';
    const swatch = document.createElement('span');
    swatch.className = 'swatch';
    swatch.style.background = typeInfoByName[t.name].color;
    chip.append(swatch, document.createTextNode(t.name));
    legend.appendChild(chip);
  }
}

function fillSelect(select, rows, valueKey, labelKey, placeholder) {
  if (placeholder !== undefined) {
    const opt = document.createElement('option');
    opt.value = '';
    opt.textContent = placeholder;
    select.appendChild(opt);
  }
  for (const row of rows) {
    const opt = document.createElement('option');
    opt.value = row[valueKey];
    opt.textContent = row[labelKey];
    select.appendChild(opt);
  }
}

function populateFilters() {
  fillSelect(document.getElementById('filter-type'), procedureTypes, 'id', 'name');
  fillSelect(document.getElementById('filter-instrument'), instruments, 'id', 'name');
}

function populateFormSelects() {
  fillSelect(document.getElementById('f-mouse'), mice, 'id', 'subject_id', 'Select…');
  fillSelect(document.getElementById('f-instrument'), instruments, 'id', 'name', 'Select…');
  fillSelect(document.getElementById('f-project'), projects, 'id', 'name', 'Select…');
  fillSelect(document.getElementById('f-contact'), users, 'id', 'name', 'Select…');
  fillSelect(document.getElementById('f-experimenters'), users, 'id', 'name');
}

// ---------------------------------------------------------------------------
// Date helpers (all local-time; the API speaks UTC and we convert at the edge)
// ---------------------------------------------------------------------------

function startOfDay(date) {
  const d = new Date(date);
  d.setHours(0, 0, 0, 0);
  return d;
}

function addDays(date, n) {
  const d = new Date(date);
  d.setDate(d.getDate() + n);
  return d;
}

// Monday-based week start, matching the Mon–Sun week view axis.
function startOfWeek(date) {
  const d = startOfDay(date);
  const shift = (d.getDay() + 6) % 7;   // Sun=0 -> 6, Mon=1 -> 0
  return addDays(d, -shift);
}

function sameDay(a, b) {
  return a.getFullYear() === b.getFullYear()
    && a.getMonth() === b.getMonth()
    && a.getDate() === b.getDate();
}

function dayKey(date) {
  const pad = (n) => String(n).padStart(2, '0');
  return `${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())}`;
}

// "2026-08-05" -> that instant at 00:00:00 LOCAL time. A date string without
// a timezone suffix is parsed as local time, which is what we want here.
function localDayStart(dateString) {
  return new Date(`${dateString}T00:00:00`);
}

function localDayEnd(dateString) {
  return new Date(`${dateString}T23:59:59`);
}

function fmtLocal(iso) {
  return new Date(iso).toLocaleString([], { dateStyle: 'medium', timeStyle: 'short' });
}

function fmtTime(date) {
  return date.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
}

function fmtHourLabel(hour) {
  const d = new Date(2000, 0, 1, hour);
  return d.toLocaleTimeString([], { hour: 'numeric' });
}

// ---------------------------------------------------------------------------
// Data loading
// ---------------------------------------------------------------------------

function primaryTypeColor(activeTypeNames) {
  // "Primary" = the active type with the lowest sort_order (stable mapping).
  let best = null;
  for (const name of activeTypeNames) {
    const info = typeInfoByName[name];
    if (info && (best === null || info.sort_order < best.sort_order)) best = info;
  }
  return best ? best.color : '#8892a0';
}

async function loadEvents() {
  const params = new URLSearchParams();
  const typeId = document.getElementById('filter-type').value;
  const instrumentId = document.getElementById('filter-instrument').value;
  const from = document.getElementById('filter-start').value;
  const to = document.getElementById('filter-end').value;
  if (typeId) params.set('procedure_type_id', typeId);
  if (instrumentId) params.set('instrument_id', instrumentId);
  // The date inputs mean LOCAL calendar days, so convert local midnight /
  // end-of-day to UTC instants. Sending `${from}T00:00:00Z` instead would
  // shift the bounds by the UTC offset and drop genuine matches — in Pacific
  // a "To" date would have excluded everything after 16:59 local.
  if (from) params.set('start_after', localDayStart(from).toISOString());
  if (to) params.set('start_before', localDayEnd(to).toISOString());

  let records = await fetchJSON(`${API}/scheduled-procedures?${params}`);

  // Subject filter: client-side substring match on subject_id.
  const subjectQuery = document.getElementById('filter-subject').value.trim().toLowerCase();
  if (subjectQuery) {
    records = records.filter((r) => r.mouse.subject_id.toLowerCase().includes(subjectQuery));
  }

  lastRecords = records;
  renderGrid();
}

function refresh() {
  loadEvents().catch(showFetchError);
}

function showFetchError(err) {
  // Surface read failures instead of silently doing nothing.
  alert(`Request failed: ${err.message}`);
}

// Instruments to show as sub-rows. The instrument filter removes rows
// entirely rather than leaving them empty — most users narrow to a subset of
// rigs, so an empty row would just be noise.
function visibleInstruments() {
  const selected = document.getElementById('filter-instrument').value;
  const rows = selected ? instruments.filter((i) => i.id === selected) : instruments.slice();
  return rows.sort((a, b) => a.name.localeCompare(b.name));
}

// ---------------------------------------------------------------------------
// The grid: a vertical stack of blocks (day or week), each block containing
// one sub-row per instrument. All blocks live in ONE horizontal scroll
// container, so they scroll together and share a single scrollbar.
// ---------------------------------------------------------------------------

// Horizontal geometry for the current view. Day view: 24 hour-units, sized so
// FOCUS_HOURS of them fill the viewport (so the rest overflow and scroll).
// Week view: 7 day-units sized to fit exactly, so a full week needs no
// horizontal scrolling at all.
function metrics() {
  const scroller = document.getElementById('grid-scroll');
  const available = Math.max(320, scroller.clientWidth - LABEL_WIDTH);
  if (viewMode === 'week') {
    const unitWidth = available / DAYS_PER_WEEK;
    return { unitWidth, unitCount: DAYS_PER_WEEK, laneWidth: available };
  }
  const unitWidth = available / FOCUS_HOURS;
  return { unitWidth, unitCount: HOURS_PER_DAY, laneWidth: unitWidth * HOURS_PER_DAY };
}

// The blocks to render: [{start, end, label, isCurrent}], oldest first so
// today's block sits at the top of the *visible* area with past days above it.
function blockRange() {
  const today = startOfDay(new Date());
  const from = document.getElementById('filter-start').value;
  const to = document.getElementById('filter-end').value;
  let first = from ? startOfDay(localDayStart(from)) : addDays(today, -WINDOW_DAYS_BEFORE);
  let last = to ? startOfDay(localDayEnd(to)) : addDays(today, WINDOW_DAYS_AFTER);
  if (last < first) last = first;

  const blocks = [];
  if (viewMode === 'week') {
    for (let w = startOfWeek(first); w <= last; w = addDays(w, 7)) {
      blocks.push({
        start: w,
        end: addDays(w, 7),
        label: `Week of ${w.toLocaleDateString([], { month: 'long', day: 'numeric' })}`,
        isCurrent: startOfWeek(today).getTime() === w.getTime(),
      });
    }
    return blocks;
  }
  for (let d = first; d <= last; d = addDays(d, 1)) {
    blocks.push({
      start: d,
      end: addDays(d, 1),
      label: d.toLocaleDateString([], { weekday: 'long', month: 'long', day: 'numeric' }),
      isCurrent: sameDay(d, today),
    });
  }
  return blocks;
}

function renderGrid() {
  const inner = document.getElementById('grid-inner');
  const geo = metrics();
  const rows = visibleInstruments();
  const blocks = blockRange();

  inner.replaceChildren();
  inner.style.width = `${LABEL_WIDTH + geo.laneWidth}px`;
  inner.appendChild(buildAxisHeader(geo));

  let shown = 0;
  let withEvents = 0;
  for (const block of blocks) {
    const inBlock = lastRecords.filter((r) => {
      const start = new Date(r.scheduled_start);
      return start >= block.start && start < block.end;
    });
    if (inBlock.length) withEvents += 1;
    if (hideEmpty && inBlock.length === 0) continue;
    inner.appendChild(buildBlock(block, rows, inBlock, geo));
    shown += 1;
  }

  const status = document.getElementById('grid-status');
  if (!instruments.length) {
    // Nothing loaded at all — don't blame the filter for a load failure.
    status.textContent =
      'No instruments loaded. If the banner above shows an error, the API '
      + 'request failed; otherwise the database has no instruments.';
  } else if (!rows.length) {
    status.textContent = 'No instruments match the current filter.';
  } else if (!shown) {
    status.textContent = 'No procedures match the current filters.';
  } else {
    const unit = viewMode === 'week' ? 'week' : 'day';
    status.textContent =
      `${lastRecords.length} procedure(s) across ${withEvents} ${unit}(s) with sessions; ` +
      `${shown} ${unit} block(s) shown. Scroll up for past ${unit}s, down for future ones.`;
  }

  // Day view starts at the focus hour; week view has nothing to scroll.
  const scroller = document.getElementById('grid-scroll');
  scroller.scrollLeft = viewMode === 'day' ? FOCUS_START_HOUR * geo.unitWidth : 0;
  positionNowLine();
}

function buildAxisHeader(geo) {
  const header = document.createElement('div');
  header.className = 'axis-header';

  const corner = document.createElement('div');
  corner.className = 'axis-corner';
  corner.style.width = `${LABEL_WIDTH}px`;
  corner.textContent = 'Instrument';
  header.appendChild(corner);

  const units = document.createElement('div');
  units.className = 'axis-units';
  units.style.width = `${geo.laneWidth}px`;
  for (let i = 0; i < geo.unitCount; i += 1) {
    const cell = document.createElement('div');
    cell.className = 'axis-unit';
    cell.style.left = `${i * geo.unitWidth}px`;
    cell.style.width = `${geo.unitWidth}px`;
    if (viewMode === 'week') {
      // Weekday names are the axis in week view; the date lives in the
      // block header, since every week block shares the same 7 columns.
      const day = addDays(startOfWeek(new Date()), i);
      cell.textContent = day.toLocaleDateString([], { weekday: 'short' });
    } else {
      cell.textContent = fmtHourLabel(i);
    }
    units.appendChild(cell);
  }
  header.appendChild(units);
  return header;
}

function buildBlock(block, rows, records, geo) {
  const wrapper = document.createElement('div');
  wrapper.className = 'day-block';
  wrapper.dataset.blockStart = dayKey(block.start);
  if (block.isCurrent) wrapper.classList.add('is-today');

  const header = document.createElement('div');
  header.className = 'day-header';
  // The label is a narrow sticky child so it stays visible when the lanes are
  // scrolled horizontally (see the .day-header CSS note).
  const label = document.createElement('div');
  label.className = 'day-header-label';
  const title = document.createElement('span');
  title.textContent = block.label;
  label.appendChild(title);
  if (block.isCurrent) {
    const badge = document.createElement('span');
    badge.className = 'today-badge';
    badge.textContent = viewMode === 'week' ? 'This week' : 'Today';
    label.appendChild(badge);
  }
  const count = document.createElement('span');
  count.className = 'count';
  count.textContent = records.length
    ? `${records.length} procedure${records.length === 1 ? '' : 's'}`
    : 'no procedures';
  label.appendChild(count);
  header.appendChild(label);
  wrapper.appendChild(header);

  const body = document.createElement('div');
  body.className = 'block-body';
  for (const instrument of rows) {
    body.appendChild(buildInstrumentRow(block, instrument, records, geo));
  }
  if (!rows.length) {
    const note = document.createElement('div');
    note.className = 'empty-note';
    note.textContent = instruments.length
      ? 'No instruments match the filter.'
      : 'Instruments could not be loaded — see the error above.';
    body.appendChild(note);
  }
  if (block.isCurrent) body.appendChild(buildNowLine(block, geo));
  wrapper.appendChild(body);
  return wrapper;
}

function buildInstrumentRow(block, instrument, records, geo) {
  const row = document.createElement('div');
  row.className = 'instrument-row';
  row.dataset.instrumentId = instrument.id;

  const label = document.createElement('div');
  label.className = 'instrument-label';
  label.style.width = `${LABEL_WIDTH}px`;
  label.style.height = `${ROW_HEIGHT}px`;
  label.title = instrument.name;
  label.textContent = instrument.name;
  row.appendChild(label);

  const lane = document.createElement('div');
  lane.className = 'lane ruled';
  lane.style.width = `${geo.laneWidth}px`;
  lane.style.height = `${ROW_HEIGHT}px`;
  lane.style.backgroundSize = `${geo.unitWidth}px 100%`;

  const mine = records.filter((r) => r.instrument.id === instrument.id);
  if (viewMode === 'week') {
    layoutWeekBars(lane, block, mine, geo);
  } else {
    layoutDayBars(lane, block, mine, geo);
  }
  row.appendChild(lane);
  return row;
}

// Day view: left edge = start time, width = duration.
function layoutDayBars(lane, block, records, geo) {
  for (const record of records) {
    const start = new Date(record.scheduled_start);
    const end = new Date(record.scheduled_end);
    const startHours = (start - block.start) / 3600000;
    const endHours = Math.min((end - block.start) / 3600000, HOURS_PER_DAY);
    const bar = makeBar(record, `${record.mouse.subject_id} · ${record.acquisition_type}`);
    bar.style.left = `${startHours * geo.unitWidth}px`;
    bar.style.width = `${Math.max(MIN_BAR_WIDTH, (endHours - startHours) * geo.unitWidth)}px`;
    bar.title = `${record.mouse.subject_id} — ${record.acquisition_type}\n` +
                `${fmtTime(start)}–${fmtTime(end)}`;
    lane.appendChild(bar);
  }
}

// Week view: one bar inside its day column, labelled with the local time.
// Several procedures on the same rig and day share the column side by side.
function layoutWeekBars(lane, block, records, geo) {
  const byDay = new Map();
  for (const record of records) {
    const start = new Date(record.scheduled_start);
    const index = Math.floor((startOfDay(start) - block.start) / 86400000);
    if (index < 0 || index >= DAYS_PER_WEEK) continue;
    if (!byDay.has(index)) byDay.set(index, []);
    byDay.get(index).push(record);
  }
  for (const [index, dayRecords] of byDay) {
    dayRecords.sort((a, b) => new Date(a.scheduled_start) - new Date(b.scheduled_start));
    const slotWidth = geo.unitWidth / dayRecords.length;
    dayRecords.forEach((record, slot) => {
      const start = new Date(record.scheduled_start);
      const label = dayRecords.length > 1
        ? `${fmtTime(start)}`
        : `${fmtTime(start)} ${record.mouse.subject_id}`;
      const bar = makeBar(record, label);
      bar.style.left = `${index * geo.unitWidth + slot * slotWidth + 1}px`;
      bar.style.width = `${Math.max(MIN_BAR_WIDTH, slotWidth - 2)}px`;
      bar.title = `${record.mouse.subject_id} — ${record.acquisition_type}\n` +
                  `${fmtTime(start)}–${fmtTime(new Date(record.scheduled_end))}`;
      lane.appendChild(bar);
    });
  }
}

function makeBar(record, label) {
  const bar = document.createElement('button');
  bar.type = 'button';
  bar.className = 'event-bar';
  bar.dataset.procedureId = record.id;
  const color = primaryTypeColor(record.active_procedure_types);
  bar.style.background = color;
  bar.textContent = label;   // textContent: never treat data as markup
  if (record.status === 'cancelled') bar.style.textDecoration = 'line-through';
  if (record.status !== 'scheduled') bar.style.opacity = '0.7';
  bar.addEventListener('click', () => showDetail(record.id).catch(showFetchError));
  return bar;
}

// Live current-time line on today's block (day view) / inside today's column
// (week view).
function buildNowLine(block, geo) {
  const line = document.createElement('div');
  line.className = 'now-line';
  line.id = 'now-line';
  line.style.left = `${LABEL_WIDTH + nowOffsetPx(block, geo)}px`;
  return line;
}

function nowOffsetPx(block, geo) {
  const now = new Date();
  if (viewMode === 'week') {
    const dayIndex = Math.floor((startOfDay(now) - block.start) / 86400000);
    const fraction = (now - startOfDay(now)) / 86400000;
    return (dayIndex + fraction) * geo.unitWidth;
  }
  return ((now - block.start) / 3600000) * geo.unitWidth;
}

function positionNowLine() {
  const line = document.getElementById('now-line');
  if (!line) return;
  const block = blockRange().find((b) => b.isCurrent);
  if (!block) return;
  line.style.left = `${LABEL_WIDTH + nowOffsetPx(block, metrics())}px`;
}

function startNowLineTicker() {
  if (nowLineTimer) clearInterval(nowLineTimer);
  nowLineTimer = setInterval(positionNowLine, 60000);   // once a minute
}

// Put today's block at the top of the grid's visible area. Past blocks are
// rendered above it, so scrolling up reveals them.
function scrollToToday() {
  const scroller = document.getElementById('grid-scroll');
  const block = document.querySelector('.day-block.is-today')
    || document.querySelector('.day-block');
  if (!scroller || !block) return;
  const header = document.querySelector('.axis-header');
  const offset = header ? header.offsetHeight : 0;
  scroller.scrollTop = Math.max(0, block.offsetTop - offset);
}

// ---------------------------------------------------------------------------
// Detail side panel
// ---------------------------------------------------------------------------

async function showDetail(id) {
  const record = await fetchJSON(`${API}/scheduled-procedures/${id}`);
  currentDetail = record;

  document.getElementById('detail-title').textContent =
    `${record.mouse.subject_id} on ${record.instrument.name}`;
  document.getElementById('detail-status').textContent = record.status;

  // Values are rendered with textContent only (never innerHTML), so
  // user-typed content (notes, protocols, planned_config) can't inject
  // markup. {code:...} / {pre:...} wrap the text in the matching element.
  const rows = [
    ['Acquisition token (id)', { code: record.id }],
    ['Subject', record.mouse.subject_id],
    ['Instrument', `${record.instrument.name}${record.instrument.sipe_rig_name ? ` (${record.instrument.sipe_rig_name})` : ''}`],
    ['Project', record.project.name],
    ['Scientific contact', record.contact.name],
    ['Experimenters', record.experimenters.map((e) => e.name).join(', ') || '—'],
    ['Active platforms', record.active_procedure_types.join(', ')],
    ['Acquisition type', record.acquisition_type],
    ['Acquisition name', record.acquisition_name ?? '— (filled at acquisition time)'],
    ['Scheduled', `${fmtLocal(record.scheduled_start)} → ${fmtLocal(record.scheduled_end)}`],
    ['Ethics review (IACUC)', record.ethics_review_id ?? '—'],
    ['Protocols', record.protocols ?? '—'],
    ['Notes', record.notes ?? '—'],
    ['Planned config', record.planned_config
      ? { pre: JSON.stringify(record.planned_config, null, 2) } : '—'],
  ];
  const dl = document.getElementById('detail-fields');
  dl.innerHTML = '';
  for (const [label, value] of rows) {
    const dt = document.createElement('dt');
    dt.textContent = label;
    const dd = document.createElement('dd');
    if (value && typeof value === 'object') {
      const tag = 'code' in value ? 'code' : 'pre';
      const el = document.createElement(tag);
      el.textContent = value[tag];
      dd.appendChild(el);
    } else {
      dd.textContent = value;
    }
    dl.append(dt, dd);
  }
  document.getElementById('detail-panel').hidden = false;
}

function closeDetail() {
  document.getElementById('detail-panel').hidden = true;
  currentDetail = null;
}

// ---------------------------------------------------------------------------
// Add / edit modal
// ---------------------------------------------------------------------------

function renderTypeCheckboxes(instrumentId, selectedNames = []) {
  const box = document.getElementById('active-types');
  box.innerHTML = '';
  const instrument = instruments.find((i) => i.id === instrumentId);
  if (!instrument) {
    box.innerHTML = '<span class="hint">Select an instrument first.</span>';
    return;
  }
  if (!instrument.compatible_procedure_types.length) {
    box.innerHTML = '<span class="hint">This instrument has no compatible procedure types.</span>';
    return;
  }
  for (const t of instrument.compatible_procedure_types) {
    const label = document.createElement('label');
    label.className = 'type-option';
    const cb = document.createElement('input');
    cb.type = 'checkbox';
    cb.value = t.id;
    cb.checked = selectedNames.includes(t.name);
    // Modality drives the one-behavior-task rule below.
    cb.dataset.modality = t.modality_name ?? '';
    cb.addEventListener('change', applyBehaviorExclusivity);
    const swatch = document.createElement('span');
    swatch.className = 'swatch';
    swatch.style.cssText =
      `width:.65rem;height:.65rem;border-radius:3px;background:${typeInfoByName[t.name]?.color ?? '#8892a0'}`;
    label.append(cb, swatch, document.createTextNode(t.name));
    box.appendChild(label);
  }
  applyBehaviorExclusivity();
}

// A rig runs ONE behavior task, never two at once (server rule
// `multiple_behavior_types`). Once a Behavior-modality type is checked, mute
// the other Behavior options so the impossible combo can't be built;
// unchecking re-enables them. The server remains the authority — this is
// only guidance.
function applyBehaviorExclusivity() {
  const boxes = [...document.querySelectorAll('#active-types input[type=checkbox]')];
  const behavior = boxes.filter((cb) => cb.dataset.modality === BEHAVIOR_MODALITY);
  const chosen = behavior.find((cb) => cb.checked);
  for (const cb of behavior) {
    const muted = Boolean(chosen) && cb !== chosen;
    cb.disabled = muted;
    cb.closest('.type-option').style.opacity = muted ? '0.45' : '';
    cb.closest('.type-option').title = muted
      ? 'A procedure can only run one behavior task at a time.'
      : '';
  }
}

function toLocalInputValue(iso) {
  const d = new Date(iso);
  const pad = (n) => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}` +
         `T${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

// The form takes start + duration; scheduled_end is computed client-side as
// start + duration hours. The API contract is unchanged (it still receives
// scheduled_start and scheduled_end).
function computedEndDate() {
  const startValue = document.getElementById('f-start').value;
  const hours = parseFloat(document.getElementById('f-duration').value);
  if (!startValue || !(hours > 0)) return null;
  return new Date(new Date(startValue).getTime() + hours * 3600 * 1000);
}

function updateEndHint() {
  const end = computedEndDate();
  document.getElementById('end-hint').textContent = end
    ? `Ends ${end.toLocaleString([], { dateStyle: 'medium', timeStyle: 'short' })} (local time)`
    : '';
}

function openModal(record = null) {
  editingId = record ? record.id : null;
  document.getElementById('form-title').textContent =
    record ? `Edit procedure ${record.id.slice(0, 8)}…` : 'Add procedure';
  document.getElementById('form-submit').textContent = record ? 'Save' : 'Create';
  hideFormError();

  document.getElementById('f-mouse').value = record ? record.mouse.id : '';
  document.getElementById('f-instrument').value = record ? record.instrument.id : '';
  document.getElementById('f-project').value = record ? record.project.id : '';
  document.getElementById('f-contact').value = record ? record.contact.id : '';
  const experimenterIds = record ? record.experimenters.map((e) => e.id) : [];
  for (const opt of document.getElementById('f-experimenters').options) {
    opt.selected = experimenterIds.includes(opt.value);
  }
  document.getElementById('f-start').value = record ? toLocalInputValue(record.scheduled_start) : '';
  // Duration is derived from the record's end - start when editing.
  document.getElementById('f-duration').value = record
    ? String((new Date(record.scheduled_end) - new Date(record.scheduled_start)) / 3600000)
    : '2';
  updateEndHint();
  document.getElementById('f-status').value = record ? record.status : 'scheduled';
  document.getElementById('f-protocols').value = record?.protocols ?? '';
  document.getElementById('f-notes').value = record?.notes ?? '';
  document.getElementById('f-planned-config').value =
    record?.planned_config ? JSON.stringify(record.planned_config, null, 2) : '';
  renderTypeCheckboxes(record ? record.instrument.id : '', record ? record.active_procedure_types : []);

  document.getElementById('modal-backdrop').hidden = false;
}

function closeModal() {
  document.getElementById('modal-backdrop').hidden = true;
  editingId = null;
}

function showFormError(message) {
  const box = document.getElementById('form-error');
  box.textContent = message;
  box.classList.add('visible');
}

function hideFormError() {
  document.getElementById('form-error').classList.remove('visible');
}

async function submitForm(event) {
  event.preventDefault();
  hideFormError();

  const activeTypeIds = [...document.querySelectorAll('#active-types input:checked')]
    .map((cb) => cb.value);
  if (!activeTypeIds.length) {
    showFormError('Select at least one active procedure type.');
    return;
  }

  const endDate = computedEndDate();
  if (!endDate) {
    showFormError('Enter a start time and a positive duration.');
    return;
  }

  let plannedConfig = null;
  const rawConfig = document.getElementById('f-planned-config').value.trim();
  if (rawConfig) {
    try {
      plannedConfig = JSON.parse(rawConfig);
    } catch (err) {
      showFormError(`Planned config is not valid JSON: ${err.message}`);
      return;
    }
  }

  // NOTE: the write body is constructed explicitly — never echo a read
  // payload back, because server-computed fields (id, acquisition_type,
  // created_at, updated_at) are rejected by the admin API.
  const body = {
    mouse_id: document.getElementById('f-mouse').value,
    instrument_id: document.getElementById('f-instrument').value,
    project_id: document.getElementById('f-project').value,
    contact_user_id: document.getElementById('f-contact').value,
    experimenter_user_ids: [...document.getElementById('f-experimenters').selectedOptions]
      .map((o) => o.value),
    // datetime-local is local time; toISOString() converts to UTC "Z".
    // scheduled_end is computed client-side from start + duration.
    scheduled_start: new Date(document.getElementById('f-start').value).toISOString(),
    scheduled_end: endDate.toISOString(),
    active_procedure_type_ids: activeTypeIds,
    status: document.getElementById('f-status').value,
    protocols: document.getElementById('f-protocols').value.trim() || null,
    notes: document.getElementById('f-notes').value.trim() || null,
    planned_config: plannedConfig,
    // Preserved across edits; not editable in the form.
    acquisition_name: editingId ? currentDetail?.acquisition_name ?? null : null,
    ethics_review_id: editingId ? currentDetail?.ethics_review_id ?? null : null,
  };

  const url = editingId
    ? `${API}/admin/scheduled-procedures/${editingId}`
    : `${API}/admin/scheduled-procedures`;
  const response = await fetch(url, {
    method: editingId ? 'PUT' : 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body),
  });

  if (!response.ok) {
    let message = `HTTP ${response.status}`;
    try {
      const err = await response.json();
      if (typeof err.detail === 'string') {
        // The store's documented shape: {"error": code, "detail": message}
        message = err.error ? `${err.error}: ${err.detail}` : err.detail;
      } else if (Array.isArray(err.detail)) {
        // FastAPI request-validation errors.
        message = err.detail
          .map((e) => `${(e.loc || []).join('.')}: ${e.msg}`)
          .join('\n');
      }
    } catch { /* keep the HTTP status message */ }
    showFormError(message);
    return;
  }

  const record = await response.json();
  closeModal();
  await loadEvents();
  showDetail(record.id).catch(showFetchError);
}

// ---------------------------------------------------------------------------
// Wiring
// ---------------------------------------------------------------------------

function setViewMode(mode) {
  viewMode = mode;
  document.getElementById('view-day').classList.toggle('active', mode === 'day');
  document.getElementById('view-week').classList.toggle('active', mode === 'week');
  renderGrid();
  scrollToToday();
}

document.getElementById('view-day').addEventListener('click', () => setViewMode('day'));
document.getElementById('view-week').addEventListener('click', () => setViewMode('week'));
document.getElementById('jump-today').addEventListener('click', scrollToToday);

document.getElementById('hide-empty-toggle').addEventListener('change', (e) => {
  hideEmpty = e.target.checked;
  renderGrid();
  scrollToToday();
});

document.getElementById('filter-type').addEventListener('change', refresh);
document.getElementById('filter-instrument').addEventListener('change', refresh);
document.getElementById('filter-start').addEventListener('change', refresh);
document.getElementById('filter-end').addEventListener('change', refresh);

let subjectDebounce = null;
document.getElementById('filter-subject').addEventListener('input', () => {
  clearTimeout(subjectDebounce);
  subjectDebounce = setTimeout(refresh, 250);
});

document.getElementById('clear-filters').addEventListener('click', () => {
  for (const id of ['filter-type', 'filter-instrument', 'filter-start', 'filter-end', 'filter-subject']) {
    document.getElementById(id).value = '';
  }
  refresh();
});

document.getElementById('add-btn').addEventListener('click', () => openModal());
document.getElementById('edit-btn').addEventListener('click', () => {
  if (currentDetail) openModal(currentDetail);
});
document.getElementById('f-instrument').addEventListener('change', (e) => {
  renderTypeCheckboxes(e.target.value);
});
document.getElementById('f-start').addEventListener('input', updateEndHint);
document.getElementById('f-duration').addEventListener('input', updateEndHint);
document.getElementById('procedure-form').addEventListener('submit', submitForm);
document.getElementById('modal-backdrop').addEventListener('click', (e) => {
  if (e.target.id === 'modal-backdrop') closeModal();
});

// Bar widths are pixel-computed from the viewport, so re-render on resize.
let resizeDebounce = null;
window.addEventListener('resize', () => {
  clearTimeout(resizeDebounce);
  resizeDebounce = setTimeout(renderGrid, 150);
});

// Last-resort handlers: anything that escapes init() still has to be visible,
// because a silently broken page looks like an empty schedule.
window.addEventListener('error', (event) => {
  showBanner(`Page error: ${event.message}. Reload; if it persists, report this text.`);
});
window.addEventListener('unhandledrejection', (event) => {
  const reason = event.reason && event.reason.message ? event.reason.message : event.reason;
  showBanner(`Unhandled error: ${reason}. Reload; if it persists, report this text.`);
});

init().catch((err) => {
  showBanner(`Failed to load the schedule: ${err.message}`);
});
</script>
