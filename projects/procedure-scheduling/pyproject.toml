[project]
name = "procedure-scheduling"
version = "0.1.0"
description = "Prototype procedure-scheduling system for AIND acquisitions — a local DuckDB-backed reference implementation of the schema proposed for Dataverse (aind-scientific-computing#624)."
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.0",
    "fastapi>=0.110",
    "pydantic>=2.7",
    "pyarrow>=16",
    "pytz",  # required by duckdb to return TIMESTAMPTZ values as tz-aware datetimes
    "uuid-utils>=0.9",
    "uvicorn>=0.29",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
]

[tool.uv]
# Not an installable package — a small self-contained app run in place
# (uv run uvicorn / uv run pytest from this directory).
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
