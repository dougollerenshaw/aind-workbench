[project]
name = "tool-launcher"
version = "0.1.0"
description = "Multi-tool Flask app launcher for AIND tools"
requires-python = ">=3.9"
dependencies = [
    "flask>=3.0.0",
    "werkzeug>=3.0.0",
    # Dependencies for query_tool
    "aind-data-access-api",
    "pandas",
    "tabulate",
    "json5",
    # Dependencies for fiber-schematic-viewer
    "aind-metadata-service-client",
    "matplotlib>=3.8.0",
    "numpy>=1.24.0",
    # Dependencies for upgrader-tool
    "aind-metadata-upgrader",
    # Dependencies for iacuc_lookup_api (uses aind_workbench.get_iacuc_id_for_mouse)
    "requests>=2.31",
    # Dependencies for procedure-scheduling (scheduler_app runtime imports;
    # pyarrow/uvicorn are only used by its scripts/standalone CLI, not here)
    "a2wsgi",
    "fastapi",
    "pydantic>=2",
    "duckdb>=1.0",
    "uuid-utils",
    "pytz",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
